<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpsDesk — a one-person IT department</title>
<meta name="description" content="Homelab inventory, personal service desk, double-entry ledger, job pipeline, and study tracker — one local-first app. No server, no account, no build step.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%232a78d6'/%3E%3Cpath%20d='M9%2011l6%205-6%205'%20stroke='white'%20stroke-width='3'%20fill='none'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3Cpath%20d='M17%2022h7'%20stroke='white'%20stroke-width='3'%20stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="css/app.css">

<div id="app" class="app">

  <aside class="sidebar" aria-label="Main navigation">

      </span>
      <span class="brand-name">OpsDesk</span>
    </a>

    <nav class="nav">
      <a class="nav-link" href="#/dashboard" data-view="dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="nav-link" href="#/lab" data-view="lab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><circle cx="7" cy="7.5" r="1" class="dotfill"/><circle cx="7" cy="16.5" r="1" class="dotfill"/></svg>
        <span>Lab</span>
      </a>
      <a class="nav-link" href="#/desk" data-view="desk">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M5.7 5.7l4 4M18.3 5.7l-4 4M5.7 18.3l4-4M18.3 18.3l-4-4"/></svg>
        <span>Desk</span>
        <span class="nav-badge" id="nav-badge-desk" hidden></span>
      </a>
      <a class="nav-link" href="#/ledger" data-view="ledger">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11.5A2.5 2.5 0 0 1 19 6.5v13a.5.5 0 0 1-.5.5H7a2 2 0 0 1-2-2V4z"/><path d="M5 16.5A2.5 2.5 0 0 1 7.5 14H19"/><path d="M9 8h6"/></svg>
        <span>Ledger</span>
      </a>
      <a class="nav-link" href="#/pipeline" data-view="pipeline">

        <span>Pipeline</span>
      </a>
      <a class="nav-link" href="#/study" data-view="study">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9L12 4.5 21.5 9 12 13.5 2.5 9z"/><path d="M6.5 11v4.5c0 1.4 2.5 2.5 5.5 2.5s5.5-1.1 5.5-2.5V11"/><path d="M21.5 9v5"/></svg>
        <span>Study</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <a class="nav-link" href="#/settings" data-view="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h0a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h0a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>

      <button class="theme-btn" id="theme-toggle" type="button" title="Cycle theme (system → light → dark)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="theme-label">System</span>
      </button>

  </aside>

  <main class="main">
    <header class="topbar">
      <h1 class="view-title" id="view-title">Dashboard</h1>
      <div class="topbar-right">
        <button class="btn ghost search-btn" id="search-btn" type="button" title="Search everything">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span>Search</span><span class="kbd">Ctrl K</span>
        </button>
        <div class="topbar-actions" id="topbar-actions"></div>
      </div>
    </header>
    <div id="view" class="view" tabindex="-1"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="js/store.js"></script>
<script src="js/seed.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/palette.js"></script>
<script src="js/welcome.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/lab.js"></script>
<script src="js/views/desk.js"></script>
<script src="js/views/ledger.js"></script>
<script src="js/views/pipeline.js"></script>
<script src="js/views/study.js"></script>
<script src="js/views/settings.js"></script>
